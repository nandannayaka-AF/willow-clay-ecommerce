<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Willow & Clay</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #f4efe6; color: #33302b; }
    main { max-width: 420px; margin: 5rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 2px 8px #0002; }
    h1 { color: #6b7860; } label, input, button { display: block; width: 100%; box-sizing: border-box; } label { margin-top: 1rem; } input { margin-top: .35rem; padding: .7rem; } button { margin-top: 1rem; padding: .8rem; border: 0; border-radius: 4px; background: #8a5a44; color: white; font: inherit; cursor: pointer; } #message { min-height: 1.5rem; } a { color: #6e4636; }
    .password-field { position: relative; } .password-field input { padding-right: 4.5rem; } .password-toggle { position: absolute; right: .35rem; top: .55rem; width: auto; margin: 0; padding: .35rem .45rem; background: transparent; color: #6e4636; font-size: .85rem; text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Choose a new password</h1>
    <p>Set a new password for your Willow & Clay account.</p>
    <form id="password-form">
      <label>New password
        <span class="password-field">
          <input id="password" type="password" minlength="6" required>
          <button class="password-toggle" type="button" aria-controls="password" aria-pressed="false">Show</button>
        </span>
      </label>
      <label>Confirm password
        <span class="password-field">
          <input id="confirm-password" type="password" minlength="6" required>
          <button class="password-toggle" type="button" aria-controls="confirm-password" aria-pressed="false">Show</button>
        </span>
      </label>
      <button type="submit">Update Password</button>
    </form>
    <p id="message" aria-live="polite"></p>
    <a href="login.html">Back to login</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    document.querySelectorAll('.password-toggle').forEach(function (button) {
      button.addEventListener('click', function () {
        const password = document.querySelector(`#${this.getAttribute('aria-controls')}`);
        const showing = password.type === 'text';
        password.type = showing ? 'password' : 'text';
        this.textContent = showing ? 'Show' : 'Hide';
        this.setAttribute('aria-pressed', String(!showing));
      });
    });

    document.querySelector('#password-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      const message = document.querySelector('#message');
      const password = document.querySelector('#password').value;
      const confirmPassword = document.querySelector('#confirm-password').value;

      if (password !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        return;
      }

      try {
        const client = await getAuthClient();
        const { error } = await client.auth.updateUser({ password: password });
        if (error) throw error;
        message.textContent = 'Password updated. Go back to login and sign in.';
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
