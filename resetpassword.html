<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Willow & Clay">

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f4efe6;
      color: #33302b;
    }

    main {
      max-width: 420px;
      margin: 5rem auto;
      padding: 2rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px #0002;
    }

    h1 {
      color: #6b7860;
    }

    label,
    input,
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
    }

    label {
      margin-top: 1rem;
    }

    input {
      margin-top: 0.35rem;
      padding: 0.7rem;
    }

    button {
      margin-top: 1rem;
      padding: 0.8rem;
      border: 0;
      border-radius: 4px;
      background: #8a5a44;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    #message {
      min-height: 1.5rem;
    }
  </style>
</head>

<body>

  <main>

    <h1>Reset Password</h1>

    <p>Enter your new password.</p>

    <form id="reset-form">

      <label>
        New Password
        <input
          id="password"
          type="password"
          minlength="6"
          required
        >
      </label>

      <label>
        Confirm Password
        <input
          id="confirm-password"
          type="password"
          minlength="6"
          required
        >
      </label>

      <button type="submit">
        Update Password
      </button>

    </form>

    <p id="message" aria-live="polite"></p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>

  <script>

    const form = document.querySelector('#reset-form');
    const message = document.querySelector('#message');

    form.addEventListener('submit', async function (event) {

      event.preventDefault();

      const password =
        document.querySelector('#password').value;

      const confirmPassword =
        document.querySelector('#confirm-password').value;

      if (password !== confirmPassword) {

        message.textContent =
          'Passwords do not match.';

        return;
      }

      try {

        const client = await getAuthClient();

        const { error } =
          await client.auth.updateUser({
            password: password
          });

        if (error) {
          throw error;
        }

        message.textContent =
          'Password updated successfully. You can now sign in.';

        form.reset();

      } catch (error) {

        console.error(error);

        message.textContent =
          error.message;

      }

    });

  </script>

</body>
</html>
